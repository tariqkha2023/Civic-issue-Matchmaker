name: Backend CI ## continuous integration automatically checks new code 

on:
  push:
  pull_request:

# virtual cloud computer to test new code provided by GitHub 
jobs:
  backend-tests:
    runs-on: ubuntu-latest   ## a linux OS

    env:
      DATABASE_URL: postgresql://civic_user:civic_password@localhost:5432/civic_matchmaker
      TEST_DATABASE_URL: postgresql://civic_user:civic_password@localhost:5432/civic_matchmaker

    services:
      postgres:
        image: postgres:16
        options: >-
          --health-cmd "pg_isready -U civic_user -d civic_matchmaker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        env:
          POSTGRES_DB: civic_matchmaker
          POSTGRES_USER: civic_user
          POSTGRES_PASSWORD: civic_password
        ports:
          - 5432:5432
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      
      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check backend

      - name: Install test dependencies
        run: pip install pytest httpx

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest